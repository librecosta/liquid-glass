name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24 / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LG_BROWSER: chromium
      # Original Windows Chrome screenshot gold remains a local exact check.
      # Portable exact decoded map/SVG and Node math contracts still run here.
      LG_EXACT_PIXELS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install pinned Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Node contracts, TypeScript, builds, browser behavior and external tarball
        run: npm run check
      - name: Retain diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-diagnostics
          path: test-results/
          retention-days: 7
